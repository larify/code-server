name: DailyBuild

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 16 * * *'

jobs:
  auto-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build latest
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: Build Latest
          client-payload: '{ "tag": "latest", "repo": "${{ github.repository }}" }'

  cleanup-runs:
    needs: auto-build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: cleanup-workflow-runs
      cancel-in-progress: false
    steps:
      - name: Keep 5 completed DailyBuild runs
        uses: igorjs/gh-actions-clean-workflow@v8
        with:
          workflow_names: DailyBuild
          runs_older_than: 0
          runs_to_keep: 5

      - name: Keep 20 completed Release runs
        uses: igorjs/gh-actions-clean-workflow@v8
        with:
          workflow_names: Release
          runs_older_than: 0
          runs_to_keep: 5
