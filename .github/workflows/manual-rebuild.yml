name: Manual Rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      force-rebuild: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
