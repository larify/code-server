name: Release

on:
  repository_dispatch:
  workflow_call:
    inputs:
      force-rebuild:
        type: boolean
        default: false
    secrets:
      ACTIONS_TRIGGER_PAT:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

concurrency:
  group: ${{ inputs.force-rebuild && github.run_id || format('{0}-{1}:{2}', github.workflow, github.event.client_payload.repo, github.event.client_payload.tag) }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}
      changed: ${{ steps.upstream.outputs.changed }}
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    env:
      VERSION_CACHE_PREFIX: code-server-release/${{ github.event.client_payload.repo }}:${{ github.event.client_payload.tag }}/
    steps:
      - name: Restore last successful version
        if: ${{ !inputs.force-rebuild }}
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/code-server-release-version
          key: ${{ env.VERSION_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.VERSION_CACHE_PREFIX }}

      - name: Check upstream code-server version
        id: upstream
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { existsSync, readFileSync } = require('node:fs')
            const { join } = require('node:path')
            const { repository } = await github.graphql(`
              {
                repository(owner: "coder", name: "code-server") {
                  latestRelease { tagName }
                }
              }
            `)

            const tag = repository.latestRelease?.tagName ?? ''
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) {
              throw new Error(`Invalid upstream code-server tag: ${tag}`)
            }

            const cacheFile = join(process.env.RUNNER_TEMP, 'code-server-release-version')
            const cachedTag = existsSync(cacheFile) ? readFileSync(cacheFile, 'utf8').trim() : ''
            core.info(`Upstream version: ${tag}, last successful version: ${cachedTag || 'none'}`)
            core.setOutput('tag', tag)
            core.setOutput('version', tag.slice(1))
            core.setOutput('changed', tag !== cachedTag)

  docker:
    needs: check-version
    if: ${{ inputs.force-rebuild || needs.check-version.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-code-server
      queue: max
    env:
      IMAGE_REPO: ${{ inputs.force-rebuild && github.repository || github.event.client_payload.repo }}
      IMAGE_TAG: ${{ inputs.force-rebuild && 'latest' || github.event.client_payload.tag }}
    steps:
      - name: Check manual release credentials
        if: ${{ inputs.force-rebuild }}
        env:
          RELEASE_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Manual rebuild requires the ACTIONS_TRIGGER_PAT secret."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Download Nerd Fonts
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ryanoasis/nerd-fonts
          latest: true
          fileName: FiraCode.zip
          out-file-path: ${{ runner.temp }}

      - name: Extract FiraCode Mono fonts
        run: unzip -oj "$RUNNER_TEMP/FiraCode.zip" '*Mono-*.ttf' -d fonts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve GHCR image name
        id: ghcr
        shell: bash
        run: printf 'image=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          no-cache: ${{ inputs.force-rebuild || false }}
          context: .
          build-args: CODE_SERVER_VERSION=${{ needs.check-version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            ${{ steps.ghcr.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Replace Git tag
        if: ${{ inputs.force-rebuild }}
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.tag }}
        run: git push --force origin "HEAD:refs/tags/$UPSTREAM_TAG"

      - name: Write manual release notes
        if: ${{ inputs.force-rebuild }}
        env:
          GHCR_IMAGE: ${{ steps.ghcr.outputs.image }}
          UPSTREAM_TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          {
            printf '### Container images\n\n'
            printf -- '- Docker Hub `%s:%s`\n' "$IMAGE_REPO" "$IMAGE_TAG"
            printf -- '- GHCR `%s`\n\n' "$GHCR_IMAGE"
            printf 'Upstream [code-server %s](https://github.com/coder/code-server/releases/tag/%s)\n\n' "$UPSTREAM_TAG" "$UPSTREAM_TAG"
            printf 'Built from `%s` in [workflow run %s (attempt %s)](%s/%s/actions/runs/%s/attempts/%s).\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > "$RUNNER_TEMP/code-server-release.md"

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ inputs.force-rebuild && secrets.ACTIONS_TRIGGER_PAT || github.token }}
          tag: ${{ needs.check-version.outputs.tag }}
          commit: ${{ github.sha }}
          bodyFile: ${{ inputs.force-rebuild && format('{0}/code-server-release.md', runner.temp) || '' }}
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: ${{ inputs.force-rebuild || false }}
          skipIfReleaseExists: ${{ !inputs.force-rebuild }}

      - name: Record successful version
        if: ${{ !inputs.force-rebuild }}
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.tag }}
        run: printf '%s\n' "$UPSTREAM_TAG" > "$RUNNER_TEMP/code-server-release-version"

      - name: Cache successful version
        if: ${{ !inputs.force-rebuild }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/code-server-release-version
          key: ${{ needs.check-version.outputs.cache-key }}
