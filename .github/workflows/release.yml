name: Release

on:
  repository_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.repo }}:${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}
      changed: ${{ steps.compare.outputs.changed }}
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    env:
      VERSION_CACHE_PREFIX: code-server-release/${{ github.event.client_payload.repo }}:${{ github.event.client_payload.tag }}/
    steps:
      - name: Read upstream code-server release
        id: upstream
        shell: bash
        run: |
          release_tag=$(curl -fsSL --retry 3 https://api.github.com/repos/coder/code-server/releases/latest |
            jq -er '.tag_name')
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream code-server tag: $release_tag" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$release_tag" "${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore last successful version
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/code-server-release-version
          key: ${{ env.VERSION_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.VERSION_CACHE_PREFIX }}

      - name: Compare upstream and cached versions
        id: compare
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          cache_file="$RUNNER_TEMP/code-server-release-version"
          if [[ -f "$cache_file" ]] && [[ "$(<"$cache_file")" == "$UPSTREAM_TAG" ]]; then
            echo "Upstream version $UPSTREAM_TAG has not changed."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: check-version
    if: ${{ needs.check-version.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Nerd Fonts
        run: |
          mkdir -p /tmp/fonts
          INSTALL_FONTS=(FiraCode)
          for i in ${INSTALL_FONTS[@]}; do
            echo "Downloading font ${i} ==> https://github.com/ryanoasis/nerd-fonts/releases/latest/download/${i}.zip"
            wget -q https://github.com/ryanoasis/nerd-fonts/releases/latest/download/${i}.zip
            echo "Unzipping font ${i}.zip"
            unzip -q -o ${i}.zip -d /tmp/fonts
            rm -rf ${i}.zip
          done
          rm -rf ./fonts
          mkdir -p ./fonts
          cp /tmp/fonts/*Mono-*.ttf ./fonts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          build-args: |
            NODE_VER=${{ github.event.client_payload.node }}
            CODE_SERVER_VERSION=${{ needs.check-version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ github.event.client_payload.repo }}:${{ github.event.client_payload.tag }}
          cache-from: type=registry,ref=${{ github.event.client_payload.repo }}:buildcache
          cache-to: type=registry,ref=${{ github.event.client_payload.repo }}:buildcache,mode=max

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes ||
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Record successful version
        env:
          UPSTREAM_TAG: ${{ needs.check-version.outputs.tag }}
        run: printf '%s\n' "$UPSTREAM_TAG" > "$RUNNER_TEMP/code-server-release-version"

      - name: Cache successful version
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/code-server-release-version
          key: ${{ needs.check-version.outputs.cache-key }}
